name: Build and test
on: [push, pull_request]
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test tests/DotaHpAlert.Tests -c Release
      - run: dotnet run --project src/DotaHpAlert.Demo -c Release
      - run: dotnet build src/DotaHpAlert.App -c Release
