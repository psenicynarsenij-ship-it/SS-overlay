name: Build and test
on: [push, pull_request]
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OMP_THREAD_LIMIT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Linux native OCR runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libtesseract5
      - run: dotnet restore DotaHpAlert.sln --locked-mode
      - run: dotnet build DotaHpAlert.sln -c Release --no-restore
      - run: dotnet test tests/DotaHpAlert.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Test Windows overlay styles and packaged WAV (no Dota 2)
        if: runner.os == 'Windows'
        run: dotnet test tests/DotaHpAlert.WindowsTests -c Release --no-build --logger "trx;LogFileName=windows-notifications.trx"
      - run: dotnet run --project src/DotaHpAlert.Demo -c Release --no-build
      - name: Publish Windows x64
        if: runner.os == 'Windows'
        run: dotnet publish src/DotaHpAlert.App -c Release -r win-x64 --self-contained true -p:RestoreLockedMode=false -o artifacts/win-x64
      - name: Upload Windows application
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DotaHpAlert-win-x64
          path: artifacts/win-x64/
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: tests/**/TestResults/*.trx
