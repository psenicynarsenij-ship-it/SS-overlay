name: Build and test
on: [push, pull_request]
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OMP_THREAD_LIMIT: '1'
      SS_UI_SCREENSHOTS: '${{ github.workspace }}/artifacts/fluent-screenshots'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Linux native OCR runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libtesseract5
      - run: dotnet restore DotaHpAlert.sln --locked-mode
      - run: dotnet build DotaHpAlert.sln -c Release --no-restore
      - run: dotnet test tests/DotaHpAlert.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Test Windows overlay styles and packaged WAV (no Dota 2)
        if: runner.os == 'Windows'
        run: dotnet test tests/DotaHpAlert.WindowsTests -c Release --no-build --logger "trx;LogFileName=windows-notifications.trx"
      - run: dotnet run --project src/DotaHpAlert.Demo -c Release --no-build
      - name: Publish Windows x64
        if: runner.os == 'Windows'
        run: dotnet publish src/DotaHpAlert.App -c Release -r win-x64 --self-contained true -p:RestoreLockedMode=false -o artifacts/win-x64
      - name: Verify all six packaged sound files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $names = @('hp-alert.wav','short-loud-chime.mp3','error-notification.mp3','steam-.mp3','delivered-message-sound.mp3','steam-achievement.mp3')
          foreach ($name in $names) {
            $file = Join-Path 'artifacts/win-x64/sounds' $name
            if (!(Test-Path $file) -or (Get-Item $file).Length -eq 0) { throw "Missing preset: $name" }
            if ($name -ne 'hp-alert.wav') {
              $source = Join-Path 'assets/sounds/library' $name
              if ((Get-FileHash $source).Hash -ne (Get-FileHash $file).Hash) { throw "Preset changed: $name" }
            }
          }
      - name: Upload Windows application
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SS-Overlay-Fluent-Dark
          path: artifacts/win-x64/
      - name: Upload actual WPF layout renders
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SS-Overlay-Fluent-Dark-Screenshots
          path: artifacts/fluent-screenshots/*.png
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: tests/**/TestResults/*.trx
